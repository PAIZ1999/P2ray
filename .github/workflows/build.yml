name: build and release

# P2ray 发布流程
# - push 到 master：构建产物作为 artifact 保留，便于回看
# - 打 tag（如 v1.0.0）：构建并创建 GitHub Release，供客户端自更新拉取

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # 打 tag 时先确认 tag 与程序集版本一致。
  #
  # 为什么必须有这一步：Utils.GetVersionInfo() 读的是程序集版本（Directory.Build.props
  # 里的 <Version>），自更新拿它和 Release 的 tag 比较。两者不一致时，
  # 已经更新到新版的用户会被反复提示"有新版本"—— 因为程序始终自称旧版本。
  # 之前 v1.0.1–v1.0.5 全都没有改这个号，全被发成了自称 1.0.0 的包。
  version-guard:
    name: version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches <Version>
        shell: bash
        run: |
          # 只在 tag 推送时校验。分支推送没有版本语义，直接跳过；
          # 这里不写 job 级 if，否则 build 会因依赖被跳过而一起跳过。
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "not a tag push, skip"
            exit 0
          fi

          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oP '(?<=<Version>)[^<]+' v2rayN/Directory.Build.props | head -1)
          echo "tag      = $tag"
          echo "declared = $declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 Directory.Build.props 的 <Version>$declared</Version> 不一致。发版前请先把版本号改成 $tag。"
            exit 1
          fi

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests
        working-directory: ./v2rayN
        # TUnit 是 Microsoft.Testing.Platform 项目，本身就是一个可执行的测试宿主。
        # .NET 10 SDK 已移除 `dotnet test` 的 VSTest 路径（MTP 要求 opt-in），
        # 直接 `dotnet test` 会报 "Testing with VSTest target is no longer supported"。
        # 所以先 build 再运行测试宿主 exe —— 与本地验证方式完全一致。
        run: |
          dotnet build ServiceLib.Tests/ServiceLib.Tests.csproj -c Release
          ./ServiceLib.Tests/bin/Release/net10.0/ServiceLib.Tests.exe

  build:
    name: build ${{ matrix.rid }}
    needs: [test, version-guard]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive_suffix: windows-64
          - rid: win-arm64
            archive_suffix: windows-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build release
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -Runtime ${{ matrix.rid }}

      - name: Package archive
        shell: pwsh
        run: |
          $src = "dist/P2ray-${{ matrix.rid }}"
          $dst = "P2ray-${{ matrix.archive_suffix }}.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $dst -CompressionLevel Optimal
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash
          "$hash  $dst" | Out-File -FilePath "$dst.sha256" -Encoding ascii
          Write-Host "archive: $dst ($([math]::Round((Get-Item $dst).Length / 1MB, 1)) MB)"
          Write-Host "sha256 : $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: P2ray-${{ matrix.archive_suffix }}
          path: |
            P2ray-${{ matrix.archive_suffix }}.zip
            P2ray-${{ matrix.archive_suffix }}.zip.sha256
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
